<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">

<meta http-equiv="Content-Security-Policy"
      content="default-src 'self';
               img-src 'self' data:;
               font-src 'self';
               style-src 'self';
               script-src 'self';
               connect-src 'self';
               form-action 'self';
               base-uri 'self';
               object-src 'none';
               frame-src 'none';
               upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">

<title>Escolha a empresa | Portal do Cliente Facchini</title>
<meta name="theme-color" content="#0B1E33">

<link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">

<link rel="preload" href="../assets/fonts/archivo-variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/inter-variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/base.css">
<!-- Mesma casca visual do login (painel + foto) — reaproveita login.css
     em vez de duplicar layout quase idêntico. Só a lista de empresas em
     si (abaixo) é exclusiva desta tela. -->
<link rel="stylesheet" href="../css/login.css">
<link rel="stylesheet" href="../css/selecionar-empresa.css">
</head>

<body>
<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-predio" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 8h1M14 8h1M9 12h1M14 12h1M9 16h1M14 16h1"/>
  </symbol>
  <symbol id="i-seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 12h15m-5.5-5.5L19 12l-5.5 5.5"/>
  </symbol>
</svg>

<main class="acesso" id="conteudo">
  <div class="acesso__grade">

    <section class="acesso__painel-formulario" aria-label="Escolha de empresa">
      <div class="acesso__conteudo">

        <a class="acesso__marca" href="https://www.facchiniassessoria.com.br/" aria-label="Facchini Assessoria Contábil — ir para o site">
          <img class="acesso__logo" src="../assets/logo/facchini-logo.webp"
               width="640" height="133" alt="Facchini Assessoria Contábil">
        </a>

        <div class="acesso__cabecalho">
          <span class="acesso__linha-ouro" aria-hidden="true"></span>
          <h1 class="acesso__titulo">Olá, <strong>{{ nome_usuario }}</strong></h1>
          <p class="acesso__subtitulo">Você tem acesso a mais de uma empresa. Qual delas você quer ver agora?</p>
        </div>

        <ul class="lista-empresas" data-lista-empresas>
          {% for empresa in empresas %}
          <li>
            <button type="button" class="empresa-card" data-selecionar-empresa data-identificador="{{ empresa.identificador }}">
              <span class="empresa-card__avatar" aria-hidden="true"><svg class="icone"><use href="#i-predio"/></svg></span>
              <span class="empresa-card__texto">
                <strong>{{ empresa.fantasia }}</strong>
                <small>CNPJ {{ empresa.cnpj }}</small>
              </span>
              <svg class="icone empresa-card__seta" aria-hidden="true"><use href="#i-seta"/></svg>
            </button>
          </li>
          {% endfor %}
        </ul>

        <p class="acesso__retorno" role="status" aria-live="polite" data-retorno-selecao></p>

        <div class="acesso__rodape">
          <span class="acesso__linha-ouro" aria-hidden="true"></span>
          <p class="acesso__tagline">Contabilidade<br>que impulsiona o seu amanhã</p>
        </div>

      </div>
    </section>

    <aside class="acesso__painel-foto">
      <img class="acesso__foto"
           src="../assets/images/login-painel.webp"
           srcset="../assets/images/login-painel-560.webp 560w,
                   ../assets/images/login-painel-860.webp 860w,
                   ../assets/images/login-painel.webp 1122w"
           sizes="50vw"
           width="1122" height="1402" loading="lazy" decoding="async" alt="">
      <div class="acesso__vinheta" aria-hidden="true"></div>

      <p class="acesso__marca-vertical" aria-hidden="true">Facchini <span>•</span> Desde 2009</p>

      <p class="acesso__rodape-foto" aria-hidden="true">
        <span class="acesso__linha-ouro"></span>
        Crescimento<br>com base sólida
      </p>
    </aside>

  </div>
</main>

<script src="../js/selecionar-empresa.js" defer></script>
</body>
</html>
